<!DOCTYPE html>
<html>
<head>
 <title>Victoria's Journal</title>
 <style>
 body {
 margin: 20px;
 padding: 20px;
 background-color: lightcyan;
 }
 div {background-color: white; }
 #journal-container {
 border: 8px solid lightblue; /* changed from lightcyan so the border is visible */
 padding: 20px;
 width: 800px;
 margin: 0px auto;
 overflow: hidden; /* Ensures container wraps around floated elements */
 }
 h1 {
 color: teal;
 text-align: right;
 font-weight: normal;
 margin: 0px;
 }
 .subtitle {
 display: block;
 text-align: right;
 margin-bottom: 20px;
 border-bottom: 4px solid lightblue;
 padding-bottom: 10px;
 }
 .sidebar {
 float: left;
 padding: 15px;
 background-color: teal;
 color: white;
 width: 150px;
 margin-right: 20px;
 border: 3px solid teal;
 }
 .sidebar h2 {
 font-weight: normal;
 border-bottom: 1px solid white;
 margin: 0px;
 padding-bottom: 5px;
 }
 .content-area {
 float: left;
 width: 550px;
 }
 .entry-box {
 border: 3px solid lightblue;
 padding: 15px;
 margin-bottom: 20px;
 overflow: hidden; /* FIX: border now wraps around the floated p and img */
 }
 .entry-title {
 color: teal;
 margin-top: 0px;
 margin-bottom: 10px;
 }
 p {
 float: left;
 width: 350px;
 margin: 0px;
 }
 img {
 float: right;
 width: 150px;
 height: 100px;
 border: 1px solid grey;
 }
 .clear {
 clear: both;
 }
 </style>
</head>
<body>
<div id="journal-container">
 <h1>Victoria's Journal</h1>
 <span class="subtitle">so fresh and so clean</span>
 <div class="sidebar">
 <h2>Friends</h2>
 <ul>
 <li>Annihilator</li>
 <li>Suzie</li>
 <li>Rigby</li>
 </ul>
 </div>
 <div class="content-area">
 <div class="entry-box">
 <h3 class="entry-title">04/09/08: Spatulas</h3>
 <p>Yesterday, I went to the store I love myself than to buy myself a spatula?)</p>
 <img src="spatula.svg" alt="spatula cooking an egg in a pan"/>
 </div>
 <div class="entry-box">
 <h3 class="entry-title">04/08/08: Cookie Cupcakes</h3>
 <p>My favorite cartoon character is cookie, and my favorite dessert is cupcakes..</p>
 <img src="cupcake.svg" alt="pink frosted cupcake"/>
 </div>
 </div>
 <div class="clear"></div>
</div>
</body>
</html>
